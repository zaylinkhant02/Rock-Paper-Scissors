name: Build Multi-Platform Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: rps-linux
            compiler: gcc
          - os: windows-latest
            artifact_name: rps-windows.exe
            compiler: gcc
          - os: macos-latest
            artifact_name: rps-macos
            compiler: clang

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile C Program
        run: ${{ matrix.compiler }} -O2 -o ${{ matrix.artifact_name }} main.c

      - name: Upload Executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}